# nginx configuration for the barber shop booking app.
#
# Use this if nginx is already installed. It expects a certificate issued by
# certbot at /etc/letsencrypt/live/booking.example.com/.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/barber-booking
#   sudo ln -s /etc/nginx/sites-available/barber-booking /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app itself stays on plain HTTP on localhost; only nginx speaks TLS.

server {
    listen 80;
    listen [::]:80;
    server_name booking.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name booking.example.com;

    ssl_certificate     /etc/letsencrypt/live/booking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Customer names, phone numbers and emails are written to the database, so
    # keep request bodies small.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }
}
